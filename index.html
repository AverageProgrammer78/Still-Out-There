<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Out There: NASA's machines across the solar system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#040814;--ink:#f8fafc;--mute:#aebbd6;--sig:#ff6b5b;--ice:#93c5fd}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:300 18px/1.6 Lexend,system-ui,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#ui{position:fixed;inset:0;z-index:2;pointer-events:none}
#ui:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 62% 95% at 14% 50%,rgba(4,8,20,.86) 0%,rgba(4,8,20,.55) 48%,rgba(4,8,20,0) 78%)}
h1,h2,.quote,.next{font-family:"Young Serif",Georgia,serif;font-weight:400}
button{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;pointer-events:auto}
a{color:inherit}
:focus-visible{outline:3px solid var(--sig);outline-offset:3px;border-radius:4px}
.panel{position:absolute;left:5vw;top:50%;transform:translateY(-50%);width:min(540px,88vw);max-height:88vh;overflow:auto;transition:opacity .55s;pointer-events:auto;scrollbar-width:thin}
.panel.off{opacity:0;pointer-events:none}
h1{font-size:clamp(2.7rem,5.6vw,4.6rem);line-height:1.02;margin:0 0 12px;letter-spacing:-.02em}
.lede{max-width:34ch;font-size:1.12rem;margin:0 0 10px}
.tally{color:var(--mute);margin:0 0 14px}
.tally b{color:var(--sig);font-weight:600}
.next{display:inline-block;font-size:1.55rem;color:var(--sig);border-bottom:2px solid var(--sig);padding-bottom:3px;margin-top:6px}
.tag{color:var(--ice);font-size:.95rem;font-weight:400;margin:0 0 6px}
h2{font-size:clamp(1.9rem,4vw,2.6rem);line-height:1.1;margin:0 0 6px}
.sub{color:var(--mute);font-size:.95rem;margin:0 0 4px}
.state{display:flex;align-items:center;gap:9px;font-size:.92rem;color:var(--mute);margin:0 0 6px}
.tele{color:var(--mute);font-size:.9rem;margin:0 0 16px}
#snd{position:absolute;top:14px;right:18px;font-size:13px;color:var(--mute)}
.state i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ice);display:inline-block}
.state.live i{background:var(--sig);border-color:var(--sig)}
.quote{font-size:clamp(1.15rem,2.2vw,1.4rem);line-height:1.5;margin:0 0 14px}
.sci{color:var(--mute);margin:0 0 22px;font-size:1rem}
.sci b{color:var(--ink);font-weight:400}
.row{display:flex;gap:20px;flex-wrap:wrap;font-size:.95rem;margin-top:18px}
.row a,.row button{border-bottom:1px solid var(--mute);color:var(--mute);pointer-events:auto}
#scrub{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;pointer-events:auto}
#scrub button{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ice);position:relative;transition:transform .25s}
#scrub button.a{background:var(--sig);border-color:var(--sig)}
#scrub button.g{margin-top:9px}
#scrub button.cur{transform:scale(1.55)}
#scrub button.cur:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--sig)}
.lb{position:fixed;z-index:1;font-size:12px;color:var(--mute);pointer-events:none;transform:translate(-50%,-100%);white-space:nowrap;opacity:0}
#tip{position:fixed;z-index:3;pointer-events:none;font-size:14px;color:var(--ink);transform:translate(12px,-26px);opacity:0;font-family:"Young Serif",serif}
#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3;color:var(--mute);font-size:13px;pointer-events:none;opacity:0;transition:opacity 1.2s ease;white-space:nowrap}
#hint.show{opacity:.85}
@media(hover:none){#hint .d{display:none}}
@media(hover:hover){#hint .t{display:none}}
@media(max-width:820px){#hint{bottom:auto;top:14px}
 #ui:before{background:linear-gradient(to top,rgba(4,8,20,.94) 0%,rgba(4,8,20,.78) 45%,rgba(4,8,20,0) 75%)}
 .panel{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:64vh;padding:0 50px 14px 16px}
 h1{font-size:2.3rem;margin-bottom:8px}.lede{font-size:.98rem;margin-bottom:8px}.tally{font-size:.92rem;margin-bottom:10px}.quote{font-size:1.1rem}.next{font-size:1.35rem}}
@media(prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>
<div id="ui">
 <section class="panel" id="hero">
  <h1>Still Out There</h1>
  <p class="lede">People sent robots to the Moon, to Mars, and out past the planets. Fly across the solar system and hear each one tell its own story.</p>
  <p class="tally" id="tally"></p>
  <button class="next" id="begin">Begin at the Moon &rarr;</button>
 </section>
 <section class="panel off" id="card" aria-live="polite">
  <p class="tag" id="tag"></p>
  <h2 id="mn"></h2>
  <p class="sub" id="ms"></p>
  <p class="state" id="mst"><i></i><span></span></p>
  <p class="tele" id="mt"></p>
  <p class="quote" id="mq"></p>
  <p class="sci" id="msc"></p>
  <button class="next" id="next">Next machine &rarr;</button>
  <div class="row"><a id="mu" target="_blank" rel="noopener">NASA source</a><button id="sig">Send signal to Earth</button><button id="lk">Look back at Earth</button><button id="prev">Previous</button><button id="out">Zoom out to Solar System</button></div>
 </section>
 <nav id="scrub" aria-label="Jump to a machine"></nav>
 <button id="snd" aria-pressed="false">Music: Off</button>
</div>
<div id="tip"></div>
<div id="hint"><span class="d">Drag to explore · Scroll to zoom</span><span class="t">Drag to explore · Pinch to zoom</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= STORIES ================= */
const B=[["moon","The Moon"],["mars","Mars"],["sun","Orbiting the Sun"],["far","The outer solar system and beyond"]];
const D=[
{z:"moon",n:"Surveyor 3",y:"Landed 1967 in the Ocean of Storms",a:0,v:"I was a robot scout. Before any human walked on the Moon, I checked that a spacecraft could land softly and not sink into dust. Two and a half years later, Apollo 12 astronauts walked over and took my camera home.",s:"I dug into the soil and showed it was firm enough to hold a lander, which helped make Apollo possible.",u:"https://science.nasa.gov/mission/surveyor-3/"},
{z:"moon",n:"Eagle's descent stage (Apollo 11)",y:"Landed July 20, 1969 in the Sea of Tranquility",a:0,v:"I'm the bottom half of the lunar module Eagle. When Neil and Buzz blasted off, they used me as their launch pad and left me behind. I've been sitting in the Sea of Tranquility ever since.",s:"I carried the first people to the Moon's surface. They brought home about 22 kg of Moon rock and soil.",u:"https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=1969-059C"},
{z:"moon",n:"ALSEP science stations",y:"Left 1969 to 1972, shut off 1977",a:0,v:"We're the science stations the astronauts set up and walked away from. We kept listening to the Moon on our own until NASA turned us off in 1977.",s:"Our seismometers recorded thousands of moonquakes, and mirrors left on the Moon still bounce lasers back to Earth so scientists can measure the distance to the Moon.",u:"https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=1969-099C"},
{z:"moon",n:"Moon buggies",y:"Driven 1971 and 1972 on Apollo 15, 16 and 17",a:0,v:"There are three of us, and we're the only vehicles ever driven by humans on another world. Astronauts parked us for the last time and we've been waiting ever since. The Apollo 17 buggy drove about 36 km.",s:"We let astronauts travel far from their lander, so they could collect rocks from many different places.",u:"https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=1971-063C"},
{z:"mars",n:"Viking 1",y:"Landed July 20, 1976 in Chryse Planitia",a:0,v:"I was the first U.S. lander to work on Mars. I sent home the first clear photos from the surface, and I kept working for over six years. My twin, Viking 2, landed a few weeks after me.",s:"I ran experiments searching for signs of life in Martian soil. The results were puzzling, and scientists still talk about them.",u:"https://science.nasa.gov/mission/viking-1/"},
{z:"mars",n:"Sojourner",y:"Landed July 4, 1997 in Ares Vallis",a:0,v:"I'm the size of a microwave oven, and I was the first rover on Mars. I was built to last 7 Martian days. I lasted 83.",s:"I tested rocks with a tool that measures their chemistry. I proved that a rover can really work on Mars.",u:"https://science.nasa.gov/mission/mars-pathfinder/"},
{z:"mars",n:"Spirit and Opportunity",y:"Landed January 2004",a:0,v:"We're twins, and we were built for 90 days. Spirit got stuck in soft sand and went quiet in 2010. Opportunity rolled on for about 14 years, until a giant dust storm blocked its sunlight in 2018. It drove about 45 km, a marathon on Mars.",s:"We found minerals that only form in water. That showed ancient Mars was wetter than it is today.",u:"https://science.nasa.gov/mission/mars-exploration-rovers-spirit-and-opportunity/"},
{z:"mars",n:"Phoenix",y:"Landed May 25, 2008 near the north pole",a:0,v:"I landed near the north pole of Mars and dug a trench with a robot arm. When the Martian winter brought darkness, my solar panels couldn't make enough power, and I went quiet.",s:"I touched water ice just under the soil, confirming that Mars hides frozen water.",u:"https://science.nasa.gov/mission/phoenix/"},
{z:"mars",n:"Curiosity",y:"Landed August 6, 2012 in Gale Crater",a:1,v:"I'm a car-sized rover, and I'm still climbing a mountain on Mars. Every day I pick a rock, zap it with a laser, and see what it's made of.",s:"I found that Gale Crater once held a lake with the ingredients life needs.",u:"https://science.nasa.gov/mission/msl-curiosity/"},
{z:"mars",n:"InSight",y:"Landed November 26, 2018 in Elysium Planitia",a:0,v:"I never moved. I just sat still and listened to the inside of Mars. In four years I heard more than 1,300 marsquakes. Then dust covered my solar panels and my power ran out.",s:"My quake readings showed how big Mars' core is and how its crust and mantle are layered.",u:"https://science.nasa.gov/mission/insight/"},
{z:"mars",n:"Ingenuity helicopter",y:"First flew April 19, 2021 in Jezero Crater",a:0,v:"I was supposed to fly five times to prove a helicopter could work on Mars. I flew 72 times. On my last landing, I broke a rotor blade, and I can't fly anymore.",s:"I was the first aircraft to fly on another planet, and my flights inspired future flying machines for exploring worlds.",u:"https://science.nasa.gov/mission/mars-2020-perseverance/ingenuity-mars-helicopter/"},
{z:"sun",n:"Kepler Space Telescope",y:"Launched 2009, retired 2018",a:0,v:"I stared at one patch of sky for years and watched for stars that dimmed a tiny bit when a planet crossed in front of them. When my fuel ran out in 2018, NASA turned me off. I'm still drifting behind Earth.",s:"I helped find more than 2,600 planets around other stars and showed that planets are everywhere.",u:"https://science.nasa.gov/mission/kepler/"},
{z:"sun",n:"NEAR Shoemaker",y:"Landed February 12, 2001 on asteroid Eros",a:0,v:"I was built to orbit an asteroid, not land on one. But at the end of my mission, my team tried a gentle landing on Eros anyway. It worked, and I kept sending signals for about two more weeks.",s:"I was the first spacecraft to orbit an asteroid and the first to land on one.",u:"https://science.nasa.gov/mission/near-shoemaker/"},
{z:"sun",n:"Dawn",y:"Launched 2007, ended 2018 at Ceres",a:0,v:"I visited two worlds in the asteroid belt: Vesta, then Ceres. When my fuel ran out in 2018, I couldn't point my antenna at Earth anymore. I'll circle Ceres for at least 20 more years.",s:"I was the first spacecraft to orbit two different worlds beyond Earth, and I mapped both of them.",u:"https://science.nasa.gov/mission/dawn/"},
{z:"far",n:"Pioneer 10 and 11",y:"Launched 1972 and 1973",a:0,v:"We went first. Pioneer 10 crossed the asteroid belt and flew past Jupiter. Pioneer 11 became the first to visit Saturn. Each of us carries a metal plaque that shows people where we came from. We stopped talking years ago, in 2003 and 1995.",s:"We showed spacecraft could survive the dangerous journey to the outer planets.",u:"https://science.nasa.gov/mission/pioneer-10/"},
{z:"far",n:"Voyager 1 and 2",y:"Launched 1977",a:1,v:"We're the farthest machines humans have ever built, and we're still talking to Earth. Both of us are outside the Sun's bubble now. A message to me takes nearly a day to arrive. Each of us carries a golden record with sounds and pictures from Earth.",s:"Voyager 2 is the only spacecraft to have visited Uranus and Neptune.",u:"https://science.nasa.gov/mission/voyager/"},
{z:"far",n:"New Horizons",y:"Launched 2006",a:1,v:"I flew for nine years to reach Pluto, then kept going. I'm out in the Kuiper Belt now, and I'm still sending data home.",s:"I gave us the first close-up pictures of Pluto, and I also visited a small icy world called Arrokoth.",u:"https://science.nasa.gov/mission/new-horizons/"}
];
const $=id=>document.getElementById(id);
const live=D.filter(d=>d.a).length;
$("tally").innerHTML=`<b>${live}</b> of these machines are still talking to Earth. The other ${D.length-live} have gone quiet.`;
let idx=-1;
const IDS=["surveyor-3","eagle","alsep","moon-buggies","viking-1","sojourner","spirit-opportunity","phoenix","curiosity","insight","ingenuity","kepler","near-shoemaker","dawn","pioneer","voyager","new-horizons"];
const scrub=$("scrub");
D.forEach((d,i)=>{const b=document.createElement("button");b.className=(d.a?"a ":"")+((i&&D[i-1].z!==d.z)?"g":"");b.setAttribute("aria-label","Fly to "+d.n);b.title=d.n;b.onclick=()=>goto(i);scrub.append(b)});

/* ---------- telemetry: Mars comes from a real planetary ephemeris, the probes from NASA-published reference values ---------- */
const AUKM=149597870.7,CKMS=299792.458,YR=3.15576e10;
const EL={earth:[1.00000261,.00000562,.01671123,-.00004392,-.00001531,-.01294668,100.46457166,35999.37244981,102.93768193,.32327364,0,0],
 mars:[1.52371034,.00001847,.09339410,.00007882,1.84969142,-.00813131,-4.55343205,19140.30268499,-23.94362959,.44441088,49.55953891,-.29257343]};
function planetXYZ(n,T){const [a0,da,e0,de,i0,di,L0,dL,w0,dw,O0,dO]=EL[n],a=a0+da*T,e=e0+de*T,I=(i0+di*T)*Math.PI/180,wb=w0+dw*T,O=(O0+dO*T)*Math.PI/180,w=wb*Math.PI/180-O;
 const M=((((L0+dL*T-wb)%360)+360)%360)*Math.PI/180;let E=M;for(let k=0;k<30;k++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
 const xp=a*(Math.cos(E)-e),yp=a*Math.sqrt(1-e*e)*Math.sin(E),cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),cI=Math.cos(I),sI=Math.sin(I);
 return[(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,sw*sI*xp+cw*sI*yp]}
function marsKm(){const T=(Date.now()/864e5+2440587.5-2451545)/36525,e=planetXYZ("earth",T),m=planetXYZ("mars",T);return Math.hypot(e[0]-m[0],e[1]-m[1],e[2]-m[2])*AUKM}
function distKm(i){const z=D[i].z,now=Date.now();
 if(z==="moon")return 384400;
 if(z==="mars")return marsKm();
 if(i===11){const th=(now-Date.UTC(2009,2,7))/864e5*(360/365.2564-360/372.5)*Math.PI/180,r=1.0133;return Math.sqrt(1+r*r-2*r*Math.cos(th))*AUKM}   /* Kepler drifts away in its 372.5-day orbit */
 if(i===12)return 213e6;
 if(i===13)return 420e6;
 if(i===14)return (82+2.53*(now-Date.UTC(2003,0,23))/YR)*AUKM;
 if(i===15)return 25902068371+25.4*(now-Date.UTC(2026,10,18,10,16,7))/1000;   /* NASA: one light-day on Nov 18, 2026, 10:16:07 UTC */
 return (62.23+2.95*(now-Date.UTC(2025,8,15))/YR)*AUKM}
const ltSec=i=>distKm(i)/CKMS;
function fmtLT(s){if(s<60)return s.toFixed(1)+" seconds";if(s<3600)return(s/60).toFixed(s<1200?1:0)+" minutes";let h=Math.floor(s/3600),m=Math.floor((s%3600)/60);if(m===60){h++;m=0}return h+" hours"+(m?" "+m+" minutes":"")}
function fmtKm(k){return k>=1e9?(k/1e9).toFixed(1)+" billion km":k>=1e6?Math.round(k/1e6).toLocaleString("en-US")+" million km":(Math.round(k/1e3)*1e3).toLocaleString("en-US")+" km"}
function tel(i){const z=D[i].z,L=fmtLT(ltSec(i));
 if(z==="moon")return"About 384,000 km from Earth · "+L+" to Earth";
 if(z==="mars")return"About "+fmtKm(distKm(i))+" from Earth today · "+L+" to Earth"+(i===8?" · top speed roughly 0.1 km/h":"");
 if(i===11)return"About "+fmtKm(distKm(i))+" from Earth · about "+L+" to Earth · coasting at about 30 km/s around the Sun";
 if(i===12)return"Eros ranges from about 22 to 415 million km from Earth · 1 to 23 minutes to Earth";
 if(i===13)return"Ceres ranges from about 240 to 600 million km from Earth · 13 to 33 minutes to Earth";
 if(i===14)return"About "+fmtKm(distKm(i))+" from Earth · about 12 km/s · about "+L+" to Earth";
 if(i===15)return fmtKm(distKm(i))+" from Earth · 16.9 km/s · "+L+" to Earth";
 return"About "+fmtKm(distKm(i))+" from Earth · about 14 km/s · about "+L+" to Earth"}
setInterval(()=>{if(idx>=0&&!$("card").classList.contains("off"))$("mt").textContent=tel(idx)},1000);

/* Background music: keep music.mp3 beside this HTML file. */
const Snd={el:null,on:false,fade:0,
 ensure(){if(this.el)return this.el;const a=this.el=new Audio("music.mp3");a.loop=true;a.preload="none";a.volume=0;
  a.addEventListener("error",()=>{this.on=false;$("snd").textContent="Music unavailable";$("snd").disabled=true});return a},
 ramp(to,ms,done){clearInterval(this.fade);const a=this.el,from=a.volume,t=performance.now();
  this.fade=setInterval(()=>{const u=Math.min(1,(performance.now()-t)/ms);a.volume=from+(to-from)*u;
   if(u>=1){clearInterval(this.fade);done&&done()}},40)},
 ping(){},whoosh(){},stop(){},
 toggle(){const a=this.ensure();this.on=!this.on;
  if(this.on){const p=a.play();if(p&&p.catch)p.catch(()=>{this.on=false;$("snd").textContent="Music: Off";$("snd").setAttribute("aria-pressed","false")});this.ramp(.4,1800)}
  else this.ramp(0,900,()=>a.pause());return this.on}};
$("snd").onclick=()=>{const on=Snd.toggle(),b=$("snd");if(!b.disabled){b.textContent="Music: "+(on?"On":"Off");b.setAttribute("aria-pressed",on)}};
document.addEventListener("visibilitychange",()=>{if(!Snd.el||!Snd.on)return;
 if(document.hidden)Snd.el.pause();else{const p=Snd.el.play();p&&p.catch&&p.catch(()=>{})}});

function setUI(i){const hero=$("hero"),card=$("card");
 [...scrub.children].forEach((b,j)=>b.classList.toggle("cur",j===i));
 if(i<0){hero.classList.remove("off");card.classList.add("off");return}
 const d=D[i];$("tag").textContent=B.find(b=>b[0]===d.z)[1];$("mn").textContent=d.n;$("ms").textContent=d.y;
 $("mst").className="state"+(d.a?" live":"");$("mst").lastChild.textContent=d.a?"Still talking to Earth":"Gone quiet";
 $("mt").textContent=tel(i);$("mq").innerHTML="&ldquo;"+d.v+"&rdquo;";$("msc").innerHTML="<b>The science it made possible:</b> "+d.s;$("mu").href=d.u;
 $("lk").textContent="Look back at Earth";$("sig").textContent="Send signal to Earth";
 $("next").innerHTML=i<D.length-1?"Next machine &rarr;":"Back to the Solar System &rarr;";
 card.scrollTop=0;card.classList.remove("off");hero.classList.add("off");Snd.ping("open")}
function hideHint(){const h=$("hint");h.classList.remove("show");h.classList.add("gone")}
setTimeout(()=>{const h=$("hint");if(!h.classList.contains("gone"))h.classList.add("show")},1600);
function goto(i){idx=i;hideHint();$("hero").classList.add("off");$("card").classList.add("off");[...scrub.children].forEach((b,j)=>b.classList.toggle("cur",j===i));
 try{history.replaceState(null,"",i>=0?"#"+IDS[i]:location.pathname+location.search)}catch(_){}   /* keeps the address bar shareable: #curiosity, #voyager ... */
 window.flyTo(i,()=>setUI(i))}
window.flyTo=(i,cb)=>cb();   /* replaced by the 3D scene when WebGL is available */
window.sendSignal=()=>{};window.lookBack=()=>false;
let sigT=0;
$("sig").onclick=()=>{if(idx<0)return;const b=$("sig");window.sendSignal(idx);Snd.ping("send");b.textContent="Signal sent · reaches Earth in "+fmtLT(ltSec(idx));clearTimeout(sigT);sigT=setTimeout(()=>{b.textContent="Send signal to Earth"},5200)};
$("lk").onclick=()=>{if(idx<0)return;const on=window.lookBack(idx);$("lk").textContent=on?"Back to the spacecraft":"Look back at Earth"};
$("begin").onclick=()=>goto(0);
$("next").onclick=()=>goto(idx<D.length-1?idx+1:-1);
$("prev").onclick=()=>goto(idx>0?idx-1:-1);
$("out").onclick=()=>goto(-1);
addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
 if(k==="ArrowRight"||k==="ArrowDown"){e.preventDefault();goto(idx<D.length-1?idx+1:-1)}
 else if(k==="ArrowLeft"||k==="ArrowUp"){e.preventDefault();goto(idx>0?idx-1:-1)}
 else if(k==="Escape"&&idx>=0)goto(-1)});
function startDeepLink(){const i=IDS.indexOf(decodeURIComponent(location.hash.slice(1)));if(i>=0)goto(i)}
addEventListener("hashchange",()=>{const i=IDS.indexOf(decodeURIComponent(location.hash.slice(1)));if(i>=0&&i!==idx)goto(i);else if(!location.hash&&idx>=0)goto(-1)});
const RMQ=matchMedia("(prefers-reduced-motion:reduce)");

/* ================= 3D SOLAR SYSTEM ================= */
(function(){
if(!window.THREE)return;
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true})}catch(e){return}
window.__gl=true;
const PR=Math.min(devicePixelRatio||1,2),R=Math.random,TH=Math.tan(22.5*Math.PI/180),RM=RMQ.matches;
renderer.setPixelRatio(PR);renderer.setClearColor(0x040814,1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
const cv=renderer.domElement;cv.id="gl";document.body.prepend(cv);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.05,4000);scene.add(cam);
